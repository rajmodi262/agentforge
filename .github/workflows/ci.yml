name: AgentForge AI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov flake8 black mypy bandit pip-audit

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Type check with mypy (advisory)
      continue-on-error: true
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional --allow-untyped-defs

    - name: Format check with black (advisory)
      continue-on-error: true
      run: |
        black --check app/

    - name: Security static analysis with bandit (advisory)
      continue-on-error: true
      run: bandit -r app -q

    - name: Dependency vulnerability scan with pip-audit (advisory)
      continue-on-error: true
      run: pip-audit -r requirements.txt

    - name: Run backend tests with coverage (fail under 60%)
      env:
        MOCK_MODE: "true"
        JWT_SECRET_KEY: "test_secret_key_only_for_ci"
      run: pytest --cov-fail-under=60

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage
        path: backend/coverage.xml

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci

    - name: Unit tests (vitest)
      run: npm run test

    - name: Type check
      run: npx tsc --noEmit
      
    - name: Build frontend
      env:
        VITE_API_URL: "http://localhost:8000/api/v1"
      run: npm run build
